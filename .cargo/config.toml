# Statically link the C++ standard library (libstdc++) and libgcc on Linux.
#
# fastembed pulls in `ort`/`ort-sys`, whose `ort-download-binaries-*` feature
# bundles prebuilt ONNX Runtime C++ objects. Those objects are compiled with a
# modern GCC and require symbols from a recent libstdc++ (e.g.
# `std::__cxx11::basic_string::_M_replace_cold` from GCC 12, and the in-libstdc++
# `std::filesystem` from GCC 9+). On hosts whose *system* libstdc++ is older,
# the final link fails with `rust-lld: error: undefined symbol: ...`.
#
# Linking libstdc++/libgcc statically makes the resulting binary carry its own
# C++ runtime, so it no longer depends on the host's `libstdc++.so` at link or
# run time. Build on a machine with GCC >= 12 (e.g. a manylinux_2_28 container)
# and the binary then runs on older hosts too. macOS uses libc++, not libstdc++,
# so these flags are scoped to Linux GNU targets only.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-static-libstdc++ -static-libgcc"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-static-libstdc++ -static-libgcc"]
